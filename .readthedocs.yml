# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

conda:
   environment: docs/environment.yaml

sphinx:
   configuration: docs/conf.py

submodules:
   include: all 

build:
   os: "ubuntu-24.04" # pinned explicitly (was "ubuntu-lts-latest", which silently moved to ubuntu-26.04 and broke the build)
   tools:
      python: "miniforge3-26.3" # mambaforge is sunsetted/deprecated on RTD; miniforge3 is its direct successor (conda-forge by default, mamba included)

python:
   install:
      - requirements: requirements.txt